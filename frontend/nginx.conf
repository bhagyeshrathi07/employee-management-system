# nginx site configuration for the Employee Management System frontend container.
# - Serves the Vite production bundle as a single-page application
# - Reverse-proxies /api/ to the Spring Boot service on the compose network

server {
    # Listen on IPv4 and IPv6: busybox wget (used by the health check) resolves `localhost`
    # to ::1 first inside the container, which is refused unless nginx also binds [::]:80.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container / orchestrator health probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # REST API -> backend service (Docker Compose DNS name "backend")
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The SPA and the API share this origin, so the request is same-origin by construction.
        # Dropping the browser's Origin header keeps backend CORS checks from rejecting requests
        # when the UI is opened via an unusual host (LAN IP, custom hostname, etc.).
        proxy_set_header Origin "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Hashed build assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
